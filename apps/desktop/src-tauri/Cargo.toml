[package]
name = "vibeholding"
version = "0.0.0"
description = "墨台（VibeHolding）桌面端"
authors = ["墨台"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vibeholding_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
